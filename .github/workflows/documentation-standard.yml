name: Documentation Standard

on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Grimoire documentation
        run: python .standards/docs_policy/check.py --repo .
      - name: Check Lexicon documentation
        run: python .standards/docs_policy/check.py --repo . --config docs-standard.lexicon.json
      - name: Check Arcana documentation
        run: python .standards/docs_policy/check.py --repo . --config docs-standard.arcana.json
      - name: Check documentation impact
        if: github.event_name == 'pull_request'
        run: python .standards/docs_policy/check.py --repo . --changed-from "${{ github.event.pull_request.base.sha }}"
